name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install afmt 1.0.0
        run: |
          curl --fail --location --retry 3 https://github.com/xixiaofinland/afmt/releases/download/v1.0.0/afmt-v1.0.0-linux-x86_64.tar.gz -o /tmp/afmt.tar.gz
          mkdir -p /tmp/afmt-bin
          tar -xzf /tmp/afmt.tar.gz -C /tmp/afmt-bin
          echo /tmp/afmt-bin >> "$GITHUB_PATH"

      - name: Run full local suite
        run: npm test

  code-analyzer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java for PMD and CPD
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Dependencies
        run: npm ci

      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli@2.158.7
          sf plugins install @salesforce/plugin-code-analyzer@5.13.0 --json

      - name: Run Code Analyzer
        run: npm run analyze
